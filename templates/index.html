<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flask tabanlı, son derece modern, şık ve premium tasarımlı web hesap makinesi.">
    <title>Antigravity Hesap Makinesi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Local CSS Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme">
    <div class="background-decorations">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <div class="app-container">
        <!-- Main Calculator Card -->
        <main class="calculator-card" id="calculator-card">
            <!-- Header Controls -->
            <header class="calc-header">
                <div class="brand">
                    <span class="brand-dot"></span>
                    <h1>Antigravity</h1>
                </div>
                <div class="header-actions">
                    <!-- Scientific Mode Toggle -->
                    <button id="toggle-scientific" class="action-btn" title="Bilimsel Mod" aria-label="Bilimsel Mod Geçişi">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 7h16M4 12h16M4 17h16" />
                            <path d="M12 4v16" stroke-dasharray="2 2" />
                        </svg>
                        <span class="btn-label">Bilimsel</span>
                    </button>
                    <!-- History Panel Toggle -->
                    <button id="toggle-history" class="action-btn" title="Geçmiş" aria-label="Geçmişi Göster">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </button>
                    <!-- Theme Toggle -->
                    <button id="toggle-theme" class="action-btn" title="Tema Değiştir" aria-label="Aydınlık/Karanlık Tema">
                        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Screen / Display Area -->
            <section class="display-screen" aria-label="Hesap Makinesi Ekranı">
                <div class="expression-wrapper">
                    <span id="expression-display" class="expression"></span>
                    <span id="cursor" class="cursor">|</span>
                </div>
                <div id="result-display" class="result" aria-live="polite">0</div>
            </section>

            <!-- Keyboard Layout -->
            <section class="keyboard" id="keyboard">
                <!-- Scientific Keys Panel (Toggled dynamically) -->
                <div class="scientific-keys" id="scientific-keys">
                    <button class="key scientific" data-val="sin(">sin</button>
                    <button class="key scientific" data-val="cos(">cos</button>
                    <button class="key scientific" data-val="tan(">tan</button>
                    <button class="key scientific" data-val="sqrt(">√</button>
                    <button class="key scientific" data-val="pi">π</button>
                    <button class="key scientific" data-val="e">e</button>
                    <button class="key scientific" data-val="log(">log</button>
                    <button class="key scientific" data-val="ln(">ln</button>
                    <button class="key scientific" data-val="^">x<sup>y</sup></button>
                    <button class="key scientific" data-val="(">(</button>
                    <button class="key scientific" data-val=")">)</button>
                    <button class="key scientific" data-val="%">%</button>
                </div>

                <!-- Standard Keys Grid -->
                <div class="standard-keys">
                    <!-- Row 1 -->
                    <button class="key utility" id="key-clear" data-action="clear">AC</button>
                    <button class="key utility" id="key-backspace" data-action="backspace">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0 -2-2z"/>
                            <line x1="18" y1="9" x2="12" y2="15"/>
                            <line x1="12" y1="9" x2="18" y2="15"/>
                        </svg>
                    </button>
                    <button class="key utility" data-val="%">%</button>
                    <button class="key operator" data-val="÷">÷</button>

                    <!-- Row 2 -->
                    <button class="key number" data-val="7">7</button>
                    <button class="key number" data-val="8">8</button>
                    <button class="key number" data-val="9">9</button>
                    <button class="key operator" data-val="×">×</button>

                    <!-- Row 3 -->
                    <button class="key number" data-val="4">4</button>
                    <button class="key number" data-val="5">5</button>
                    <button class="key number" data-val="6">6</button>
                    <button class="key operator" data-val="-">-</button>

                    <!-- Row 4 -->
                    <button class="key number" data-val="1">1</button>
                    <button class="key number" data-val="2">2</button>
                    <button class="key number" data-val="3">3</button>
                    <button class="key operator" data-val="+">+</button>

                    <!-- Row 5 -->
                    <button class="key number zero" data-val="0">0</button>
                    <button class="key number" data-val=".">.</button>
                    <button class="key equal" id="key-equals">=</button>
                </div>
            </section>
        </main>

        <!-- Slide-out History Panel -->
        <aside class="history-panel" id="history-panel" aria-label="Hesaplama Geçmişi">
            <div class="history-header">
                <h2>İşlem Geçmişi</h2>
                <button id="close-history" class="close-btn" aria-label="Geçmişi Kapat">×</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="empty-history">Geçmiş işlem bulunmuyor.</div>
            </div>
            <button id="clear-history-btn" class="clear-history-btn">Geçmişi Temizle</button>
        </aside>
    </div>

    <!-- Script Link -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
